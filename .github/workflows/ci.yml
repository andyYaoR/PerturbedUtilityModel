name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # PyTorch and any optional OpenMP-linked backend can each ship a libomp;
      # allow the duplicate so importing the package never aborts (mainly macOS).
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build prerequisites
        # The native cores build with --no-build-isolation (as in the docs), so the
        # build backend, nanobind, CMake/Ninja, and PyTorch must be installed first.
        # CHOLMOD/SuiteSparse and CUDA are optional and auto-detected; when absent
        # the build falls back to the bundled approxChol solver.
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10.0" "nanobind>=2.1.0" cmake ninja
          pip install torch

      - name: Install the package (editable, no build isolation) — as documented
        run: pip install --no-build-isolation -e ".[test]"

      - name: Import smoke test
        run: |
          python -c "import purc; from purc.static_purc import PUMProblem, ForwardSolverConfig, get_solver, get_perturbation; from purc.estimators.debiased_fy import DebiasedFYEstimator, sandwich_variance; from purc.laplaciansolve import SDDMSolver, SolverConfig; print('import OK', purc.__version__)"

      - name: Run an example
        run: python examples/perturbation_comparison.py

      - name: Run the test suite
        run: pytest -q
